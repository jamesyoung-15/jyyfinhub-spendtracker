<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>{% block title %}JYYFinHub SpendTracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/">SpendTracker</a>
        <!-- checkbox drives the mobile menu, so no JS is needed -->
        <input type="checkbox" id="nav-toggle" class="nav-toggle" />
        <label for="nav-toggle" class="nav-button" aria-label="Toggle menu">
          <span class="icon-open">{% include "icons/bars.svg" %}</span>
          <span class="icon-close">{% include "icons/x.svg" %}</span>
        </label>
        <nav class="nav-links">
          <a href="/transactions">Transactions</a>
          <a href="/transaction-templates">Templates</a>
          <a href="/payment-methods">Payment methods</a>
        </nav>
      </div>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
