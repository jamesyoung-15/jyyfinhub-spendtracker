name: spendtracker-test

services:
  db:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d spendtracker_test"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    command: postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: spendtracker_test
